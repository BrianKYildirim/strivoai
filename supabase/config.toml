# Gateway JWT verification is disabled so application-level requireAuth can
# return the repository's stable 401 envelope. This endpoint is not anonymous.
[functions.validate-document]
verify_jwt = false

# Gateway JWT verification is disabled because this endpoint is IDENTITY-OPTIONAL
# BY DESIGN. A browser-capability or boot failure can happen before the user is
# authenticated (D-08), and those are precisely the failures worth recording, so an
# anonymous beacon must still be ingestable. `user_id` is derived server-side from a
# verified Authorization header when one is present and is NULL otherwise; a
# client-asserted `user_id` is never accepted (it is absent from ALLOWED_FIELDS).
[functions.log-client-diagnostic]
verify_jwt = false

